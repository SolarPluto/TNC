name: Windows tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  text-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Check text hygiene
        run: pre-commit run --all-files --show-diff-on-failure

  pytest-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run full test suite
        run: uv run pytest -q


  handle-enumeration-scope:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.scope.outputs.enabled }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect native-token diagnostic scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed.txt
          if grep -Eq '^(tests/test_windows_pipe_native_token\.py|tests/test_windows_pipe_process\.py|src/tnc/provenance/windows_pipe_token\.py|src/tnc/provenance/windows_pipe_native\.py)$' changed.txt; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  handle-enumeration-diagnostic:
    needs: handle-enumeration-scope
    if: needs.handle-enumeration-scope.outputs.enabled == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TNC_HANDLE_ENUMERATION: "1"
      TNC_HANDLE_DIAGNOSTIC_SOFT_FAIL: "1"
      TNC_HANDLE_DIAGNOSTIC_PATH: ${{ github.workspace }}\handle-enumeration-evidence.txt
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      # PR/manual coverage is intentional while Actions capacity is constrained;
      # do not spend Windows minutes on an automatic nightly until billing is known.
      - name: Run handle enumeration diagnostic
        id: diagnostic
        run: uv run pytest -q -s tests/test_windows_pipe_native_token.py

      - name: Summarize handle diagnostic
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:TNC_HANDLE_DIAGNOSTIC_PATH) {
            "## Handle enumeration diagnostic" >> $env:GITHUB_STEP_SUMMARY
            "Survivor data captured. See the handle-enumeration-evidence artifact." >> $env:GITHUB_STEP_SUMMARY
          } elseif ("${{ steps.diagnostic.outcome }}" -eq "success") {
            "## Handle enumeration diagnostic" >> $env:GITHUB_STEP_SUMMARY
            "Ran clean: no nonzero T event was observed." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "## Handle enumeration diagnostic" >> $env:GITHUB_STEP_SUMMARY
            "Diagnostic execution failed before producing survivor evidence." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload handle enumeration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handle-enumeration-evidence
          path: ${{ env.TNC_HANDLE_DIAGNOSTIC_PATH }}
          if-no-files-found: ignore
          retention-days: 30
