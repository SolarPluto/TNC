name: Windows tests

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  text-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache pre-commit environments
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Check text hygiene
        run: pre-commit run --all-files --show-diff-on-failure

  pytest-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run full test suite
        run: uv run pytest -q


  handle-enumeration-scope:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.scope.outputs.enabled }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect native-token diagnostic scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed.txt
          if grep -Eq '^(tests/test_windows_pipe_native_token\.py|tests/test_windows_pipe_process\.py|src/tnc/provenance/windows_pipe_token\.py|src/tnc/provenance/windows_pipe_native\.py)$' changed.txt; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  handle-enumeration-diagnostic:
    needs: handle-enumeration-scope
    if: needs.handle-enumeration-scope.outputs.enabled == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TNC_HANDLE_ENUMERATION: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Run native-token handle diagnostic
        if: github.event_name != 'schedule'
        run: uv run pytest -q -s tests/test_windows_pipe_native_token.py

      - name: Run nightly full-suite handle diagnostic
        if: github.event_name == 'schedule'
        run: uv run pytest -q -s
