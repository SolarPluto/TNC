[project]
name = "tnc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "selectolax>=0.4.11",
    "trafilatura>=2.2.0",
]

[project.scripts]
tnc = "tnc:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cryptography>=50.0.1",
    "pytest>=9.1.1",
]
