[project]
name = "tnc-provenance"
version = "0.1.0"
description = "Trace claims in saved news articles back to source text, with gated historical replay."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fact-checking", "osint", "provenance", "journalism", "news"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "cryptography>=50.0.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "selectolax>=0.4.11",
    "trafilatura>=2.2.0",
]

[project.scripts]
tnc = "tnc:main"

[project.urls]
Homepage = "https://github.com/SolarPluto/TNC"
Repository = "https://github.com/SolarPluto/TNC"
Issues = "https://github.com/SolarPluto/TNC/issues"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
